<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>充值审核 - ToolBase</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }
        .navbar { background: #1e293b; border-bottom: 1px solid #334155; padding: 0 24px; height: 60px; display: flex; align-items: center; justify-content: space-between; }
        .navbar-brand { font-size: 20px; font-weight: 700; color: #38bdf8; text-decoration: none; }
        .navbar-brand span { color: #818cf8; }
        .navbar-user { display: flex; align-items: center; gap: 16px; }
        .navbar-user .username { color: #94a3b8; }
        .nav-links { display: flex; gap: 4px; }
        .nav-links a { padding: 8px 16px; border-radius: 8px; color: #94a3b8; text-decoration: none; font-size: 14px; font-weight: 500; }
        .container { max-width: 1200px; margin: 0 auto; padding: 24px; }
        .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border: none; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; text-decoration: none; }
        .btn-primary { background: #38bdf8; color: #0f172a; }
        .btn-success { background: #4ade80; color: #0f172a; }
        .btn-danger { background: #ef4444; color: white; }
        .btn-sm { padding: 6px 12px; font-size: 12px; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 20px; }
        .card-header { font-size: 16px; font-weight: 600; margin-bottom: 16px; color: #f1f5f9; }
        .flex-between { display: flex; justify-content: space-between; align-items: center; }
        .flex { display: flex; }
        .gap-2 { gap: 8px; }
        .mb-4 { margin-bottom: 16px; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th { text-align: left; padding: 10px 12px; border-bottom: 2px solid #334155; color: #64748b; font-weight: 600; font-size: 12px; text-transform: uppercase; }
        td { padding: 10px 12px; border-bottom: 1px solid #1e293b; }
        .badge { display: inline-block; padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; }
        .badge-success { background: #14532d; color: #4ade80; }
        .badge-info { background: #0c4a6e; color: #38bdf8; }
        .badge-warning { background: #451a03; color: #fb923c; }
        .empty-state { text-align: center; padding: 40px 20px; color: #64748b; }
        .badge-purple { background: #3b0764; color: #c084fc; }
    </style>
</head>
<body>
<nav class="navbar">
    <a href="/dashboard" class="navbar-brand">🦅 Tool<span>Base</span></a>
    <div class="navbar-user">
        <div class="nav-links">
            <a href="/admin">管理后台</a>
        </div>
        <span class="username" sec:authentication="name">admin</span>
        <form method="post" th:action="@{/auth/logout}" style="display:inline">
            <button type="submit" class="btn btn-sm btn-danger">退出</button>
        </form>
    </div>
</nav>

<div class="container">
    <div class="flex-between mb-4">
        <h2 style="font-size: 22px;">充值审核</h2>
        <a href="/admin" class="btn btn-sm btn-primary">← 返回</a>
    </div>

    <div class="card">
        <div class="card-header">待处理充值</div>

        <div th:if="${#lists.isEmpty(pendingRecharges)}" class="empty-state">
            <h3>没有待处理的充值</h3>
            <p>所有充值申请都已处理完毕</p>
        </div>

        <table th:if="${!#lists.isEmpty(pendingRecharges)}">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>用户</th>
                    <th>金额</th>
                    <th>支付方式</th>
                    <th>备注</th>
                    <th>提交时间</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="r : ${pendingRecharges}">
                    <td th:text="${r.id}">1</td>
                    <td th:text="${r.user.username}">user</td>
                    <td style="color:#4ade80;font-weight:700;" th:text="${#numbers.formatDecimal(r.amountFen / 100.0, 1, 2)} + ' ¥'">0</td>
                    <td>
                        <span th:if="${r.paymentMethod == 'wechat'}" class="badge badge-success">微信</span>
                        <span th:if="${r.paymentMethod == 'alipay'}" class="badge badge-info">支付宝</span>
                        <span th:if="${r.paymentMethod == 'bank'}" class="badge badge-warning">银行转账</span>
                        <span th:if="${r.paymentMethod == 'usdt'}" class="badge badge-purple">USDT</span>
                    </td>
                    <td style="font-size:13px;color:#64748b;" th:text="${r.remark != null ? r.remark : '-'}">-</td>
                    <td style="color:#64748b;font-size:12px;" th:text="${#temporals.format(r.createdAt, 'yyyy-MM-dd HH:mm')}">date</td>
                    <td>
                        <div class="flex gap-2">
                            <form method="post" th:action="@{/admin/recharges/approve/{id}(id=${r.id})}">
                                <button type="submit" class="btn btn-sm btn-success">确认到账</button>
                            </form>
                            <form method="post" th:action="@{/admin/recharges/reject/{id}(id=${r.id})}">
                                <button type="submit" class="btn btn-sm btn-danger">拒绝</button>
                            </form>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
