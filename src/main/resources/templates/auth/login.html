<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToolBase - 登录</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 40px;
            width: 400px;
            max-width: 90vw;
        }
        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }
        .login-header h1 {
            font-size: 28px;
            color: #38bdf8;
        }
        .login-header h1 span { color: #818cf8; }
        .login-header p { color: #64748b; margin-top: 8px; font-size: 14px; }
        .form-group { margin-bottom: 20px; }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #94a3b8;
            margin-bottom: 6px;
        }
        .form-input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #334155;
            border-radius: 8px;
            background: #0f172a;
            color: #e2e8f0;
            font-size: 14px;
            outline: none;
            transition: border 0.15s;
        }
        .form-input:focus { border-color: #38bdf8; }
        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
        }
        .btn-primary { background: #38bdf8; color: #0f172a; }
        .btn-primary:hover { background: #7dd3fc; }
        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 14px;
        }
        .alert-error { background: #450a0a; border: 1px solid #7f1d1d; color: #fca5a5; }
        .alert-success { background: #14532d; border: 1px solid #166534; color: #86efac; }
        .login-footer { text-align: center; margin-top: 20px; font-size: 14px; color: #64748b; }
        .login-footer a { color: #38bdf8; text-decoration: none; }
        .login-footer a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <h1>🦅 Tool<span>Base</span></h1>
            <p>AI Token API 管理平台</p>
        </div>
        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
        <div th:if="${param.error}" class="alert alert-error">用户名或密码错误</div>
        <div th:if="${param.logout}" class="alert alert-success">已退出登录</div>
        <div th:if="${param.registered}" class="alert alert-success">注册成功，请登录</div>

        <form method="post" th:action="@{/auth/login}">
            <div class="form-group">
                <label>用户名</label>
                <input type="text" name="username" class="form-input" required placeholder="请输入用户名">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" name="password" class="form-input" required placeholder="请输入密码">
            </div>
            <button type="submit" class="btn btn-primary">登 录</button>
        </form>
        <div class="login-footer">
            还没有账号？<a href="/auth/register">立即注册</a>
        </div>
    </div>
</body>
</html>
