<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToolBase - 注册</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .register-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 40px;
            width: 400px;
            max-width: 90vw;
        }
        .register-header { text-align: center; margin-bottom: 32px; }
        .register-header h1 { font-size: 28px; color: #38bdf8; }
        .register-header h1 span { color: #818cf8; }
        .register-header p { color: #64748b; margin-top: 8px; font-size: 14px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 13px; font-weight: 500; color: #94a3b8; margin-bottom: 6px; }
        .form-input {
            width: 100%; padding: 12px 16px; border: 1px solid #334155;
            border-radius: 8px; background: #0f172a; color: #e2e8f0;
            font-size: 14px; outline: none; transition: border 0.15s;
        }
        .form-input:focus { border-color: #38bdf8; }
        .btn {
            width: 100%; padding: 12px; border: none; border-radius: 8px;
            font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.15s;
        }
        .btn-primary { background: #38bdf8; color: #0f172a; }
        .btn-primary:hover { background: #7dd3fc; }
        .alert { padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; font-size: 14px; }
        .alert-error { background: #450a0a; border: 1px solid #7f1d1d; color: #fca5a5; }
        .register-footer { text-align: center; margin-top: 20px; font-size: 14px; color: #64748b; }
        .register-footer a { color: #38bdf8; text-decoration: none; }
        .hint { font-size: 11px; color: #475569; margin-top: 4px; }
    </style>
</head>
<body>
    <div class="register-card">
        <div class="register-header">
            <h1>🦅 Tool<span>Base</span></h1>
            <p>注册新账号，送 ¥5 体验金</p>
        </div>
        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
        <form method="post" action="/auth/register">
            <div class="form-group">
                <label>用户名 *</label>
                <input type="text" name="username" class="form-input" required placeholder="至少3个字符">
            </div>
            <div class="form-group">
                <label>密码 *</label>
                <input type="password" name="password" class="form-input" required placeholder="至少6个字符">
            </div>
            <div class="form-group">
                <label>邮箱</label>
                <input type="email" name="email" class="form-input" placeholder="选填">
            </div>
            <div class="form-group">
                <label>显示名称</label>
                <input type="text" name="displayName" class="form-input" placeholder="选填">
            </div>
            <button type="submit" class="btn btn-primary">注 册</button>
        </form>
        <div class="register-footer">
            已有账号？<a href="/auth/login">立即登录</a>
        </div>
    </div>
</body>
</html>
