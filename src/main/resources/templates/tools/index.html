<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title th:text="#{site.name} + ' - ' + #{site.tagline}">ToolBase - Free Tools</title>
<meta name="description" th:content="#{site.subtitle}">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh}
.navbar{background:#1e293b;border-bottom:1px solid #334155;padding:0 24px;height:60px;display:flex;align-items:center;justify-content:space-between}
.navbar-brand{font-size:20px;font-weight:700;color:#38bdf8;text-decoration:none}.navbar-brand span{color:#818cf8}
.container{max-width:1200px;margin:0 auto;padding:24px}
.hero{text-align:center;padding:32px 20px 20px}
.hero h1{font-size:32px;font-weight:800;background:linear-gradient(135deg,#38bdf8,#818cf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hero p{color:#64748b;margin-top:6px;font-size:14px}
.cat-title{font-size:18px;font-weight:600;margin:24px 0 14px;color:#94a3b8}
.tool-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.tool-card{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:16px;text-decoration:none;color:#e2e8f0;transition:all .2s;display:block}
.tool-card:hover{border-color:#38bdf8;transform:translateY(-2px);background:#263548}
.tool-icon{font-size:26px;margin-bottom:6px}
.tool-name{font-size:14px;font-weight:600}
.tool-desc{font-size:11px;color:#64748b;margin-top:2px;line-height:1.4}
.footer{text-align:center;padding:20px;color:#475569;font-size:12px;border-top:1px solid #1e293b;margin-top:32px}
.footer a{color:#38bdf8;text-decoration:none}
.nav-link{padding:8px 16px;border-radius:8px;color:#94a3b8;text-decoration:none;font-size:14px;font-weight:500;transition:.15s}.nav-link:hover{background:#334155;color:#e2e8f0}.nav-link.active{background:#38bdf8;color:#0f172a}
.right-bar{display:flex;align-items:center;gap:10px}
.right-bar a{color:#38bdf8;text-decoration:none;font-size:14px;font-weight:600}
.right-bar a:hover{text-decoration:underline}
.right-bar .reg{color:#4ade80}
.right-bar .sep{color:#475569}
.lang-btn{padding:5px 10px;border:1px solid #334155;border-radius:6px;background:transparent;color:#94a3b8;font-size:12px;cursor:pointer;text-decoration:none;transition:.15s}
.lang-btn:hover{border-color:#38bdf8;color:#38bdf8}
.lang-btn.active{background:#38bdf8;color:#0f172a;border-color:#38bdf8;font-weight:600}
@media(max-width:640px){.tool-grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<nav class="navbar">
  <a href="/tools" class="navbar-brand">🦅 <span th:text="#{site.name}">ToolBase</span></a>
  <div class="nav-links" style="display:flex;gap:8px"><a href="/blog" class="nav-link">Blog</a><a href="/tools" class="nav-link active">Tools</a></div>
  <div class="right-bar">
    <a th:href="@{/tools(lang='en')}" class="lang-btn" th:classappend="${#locale.language == 'en' ? 'active' : ''}">EN</a>
    <a th:href="@{/tools(lang='zh')}" class="lang-btn" th:classappend="${#locale.language == 'zh' ? 'active' : ''}">中文</a>
    <span class="sep">|</span>
    <a href="/auth/login" th:text="#{nav.login}">Login</a>
    <span class="sep">|</span>
    <a href="/auth/register" class="reg" th:text="#{nav.signup}">Sign Up</a>
  </div>
</nav>

<div class="container">
  <div class="hero">
    <h1 th:text="#{site.tagline}">Free Online Developer Tools</h1>
    <p th:text="#{site.subtitle}">18+ tools for developers and designers.</p>
  </div>

  <th:block th:each="cat : ${ {'text':'cat.text', 'convert':'cat.convert', 'security':'cat.security', 'webdev':'cat.webdev'} }">
    <div class="cat-title" th:text="#{${cat.value}}"></div>
    <div class="tool-grid">
      <a th:each="entry : ${allTools}" th:if="${entry.value.cat == cat.key}"
         th:href="@{/tools/{id}(id=${entry.key})}" class="tool-card">
        <div class="tool-icon" th:text="${entry.value.icon}">🔧</div>
        <div class="tool-name" th:text="${entry.value.name}">Tool</div>
        <div class="tool-desc" th:text="${entry.value.desc}">Description</div>
      </a>
    </div>
  </th:block>
</div>

<div class="footer">
  <p th:text="#{site.footer}">Free online tools. Your data never leaves your browser.</p>
</div>
</body>
</html>
