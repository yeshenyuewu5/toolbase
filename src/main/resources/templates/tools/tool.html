<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title th:text="${toolMeta.name} + ' - ' + #{site.name}">Tool - ToolBase</title>
<meta name="description" th:content="${toolMeta.desc}">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh}
.navbar{background:#1e293b;border-bottom:1px solid #334155;padding:0 24px;height:60px;display:flex;align-items:center;justify-content:space-between}
.navbar-brand{font-size:20px;font-weight:700;color:#38bdf8;text-decoration:none}.navbar-brand span{color:#818cf8}
.container{max-width:820px;margin:0 auto;padding:24px}
.tool-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px}
.tool-header h1{font-size:22px;font-weight:700}
.tool-header .cat{font-weight:400;color:#64748b;font-size:13px;margin-left:6px}
.tool-header a{color:#64748b;font-size:14px;text-decoration:none}
.tool-header a:hover{color:#38bdf8}
.tool-body{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:24px}
.tool-desc-bar{font-size:13px;color:#64748b;margin-bottom:20px;line-height:1.5}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:12px;color:#94a3b8;margin-bottom:4px;font-weight:500;text-transform:uppercase;letter-spacing:.3px}
.fld textarea,.fld input[type=text],.fld input[type=number],.fld select{width:100%;padding:10px 14px;border:1px solid #334155;border-radius:8px;background:#0f172a;color:#e2e8f0;font-size:14px;outline:none}
.fld textarea{min-height:160px;font-family:monospace;font-size:13px;resize:vertical}
textarea#out{width:100%;margin-top:12px;min-height:120px;font-family:monospace;font-size:13px;border:1px solid #334155;border-radius:8px;padding:14px;background:#0f172a;color:#e2e8f0;outline:none;resize:vertical}
.btn-row{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}
.btn-row button,.tool-body>button{padding:8px 18px;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;transition:.15s;background:#334155;color:#e2e8f0}
.btn-row button:hover,.tool-body>button:hover{background:#475569}
.btn-row button:first-child{background:#38bdf8;color:#0f172a}
.btn-row button:first-child:hover{background:#7dd3fc}
#status{font-size:12px;margin:8px 0;min-height:18px;color:#4ade80}
#status.err{color:#f87171}
.tab-row{display:flex;gap:4px;margin-bottom:12px}
.tab-row button{padding:8px 20px;border:1px solid #334155;border-radius:8px 8px 0 0;background:#0f172a;color:#94a3b8;font-size:14px;cursor:pointer}
.tab-row button.tab-active{background:#1e293b;color:#38bdf8;border-color:#38bdf8;font-weight:600}
.chk-row{display:flex;gap:16px;margin:12px 0;flex-wrap:wrap}
.chk-row label{font-size:13px;color:#94a3b8;display:flex;align-items:center;gap:4px;cursor:pointer}
.chk-row input[type=checkbox]{accent-color:#38bdf8;width:16px;height:16px}
.result-box{background:#0f172a;border:1px solid #334155;border-radius:8px;padding:12px;margin-top:8px;font-size:13px}
.hash-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.hcard{background:#0f172a;border:1px solid #334155;border-radius:8px;padding:12px}
.hl{font-size:11px;color:#64748b;text-transform:uppercase;margin-bottom:4px}
.hv{font-size:13px;font-family:monospace;color:#38bdf8;word-break:break-all}
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
.scard{background:#0f172a;border:1px solid #334155;border-radius:8px;padding:12px;text-align:center}
.sv{font-size:24px;font-weight:700;color:#4ade80}
.sl{font-size:11px;color:#64748b;margin-top:2px}
.uuid-list{background:#0f172a;border:1px solid #334155;border-radius:8px;margin-top:8px}
.uuid-item{display:flex;justify-content:space-between;padding:8px 12px;font-family:monospace;font-size:12px;color:#38bdf8;cursor:pointer;border-bottom:1px solid #1e293b}
.uuid-item:last-child{border:none}
.converter-box{background:#0f172a;border:1px solid #334155;border-radius:8px;padding:16px;margin-top:8px}
.current-time{text-align:center;padding:16px;background:#0f172a;border:1px solid #334155;border-radius:8px;margin-bottom:12px}
.big-num{font-size:28px;font-weight:700;color:#4ade80;font-family:monospace}
.qr-display{text-align:center;padding:30px;background:#0f172a;border:1px solid #334155;border-radius:8px;margin-top:12px;min-height:150px;display:flex;align-items:center;justify-content:center;flex-direction:column}
.other-tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:12px}
.other-tools a{padding:8px 12px;border:1px solid #334155;border-radius:8px;color:#94a3b8;text-decoration:none;font-size:12px;transition:.15s;text-align:center}
.other-tools a:hover{border-color:#38bdf8;color:#38bdf8}
.footer{text-align:center;padding:20px;color:#475569;font-size:11px;border-top:1px solid #1e293b;margin-top:32px}
.nav-link{padding:8px 16px;border-radius:8px;color:#94a3b8;text-decoration:none;font-size:14px;font-weight:500;transition:.15s}.nav-link:hover{background:#334155;color:#e2e8f0}.nav-link.active{background:#38bdf8;color:#0f172a}
.right-bar{display:flex;align-items:center;gap:10px}
.right-bar a{color:#38bdf8;text-decoration:none;font-size:13px;font-weight:600}
.right-bar .reg{color:#4ade80}.right-bar .sep{color:#475569}
.lang-btn{padding:4px 8px;border:1px solid #334155;border-radius:6px;background:transparent;color:#94a3b8;font-size:11px;cursor:pointer;text-decoration:none}
.lang-btn:hover{border-color:#38bdf8;color:#38bdf8}
.lang-btn.active{background:#38bdf8;color:#0f172a;border-color:#38bdf8;font-weight:600}
@media(max-width:640px){.stat-row,.hash-grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<nav class="navbar">
  <a href="/tools" class="navbar-brand">🦅 <span th:text="#{site.name}">ToolBase</span></a>
  <div class="nav-links" style="display:flex;gap:8px"><a href="/blog" class="nav-link">Blog</a><a href="/tools" class="nav-link">Tools</a></div>
  <div class="right-bar">
    <a th:href="@{/tools(lang='en')}" class="lang-btn" th:classappend="${#locale.language == 'en' ? 'active' : ''}">EN</a>
    <a th:href="@{/tools(lang='zh')}" class="lang-btn" th:classappend="${#locale.language == 'zh' ? 'active' : ''}">中文</a>
    <span class="sep">|</span>
    <a href="/auth/login" th:text="#{nav.login}">Login</a>
    <span class="sep">|</span>
    <a href="/auth/register" class="reg" th:text="#{nav.signup}">Sign Up</a>
  </div>
</nav>

<div class="container">
  <div class="tool-header">
    <h1><span th:text="${toolMeta.icon}">🔧</span> <span th:text="${toolMeta.name}">Tool</span> <span class="cat" th:text="'(' + ${toolMeta.cat} + ')'"></span></h1>
    <a href="/tools" th:text="#{tool.back}">← All Tools</a>
  </div>
  <div class="tool-desc-bar" th:text="${toolMeta.desc}"></div>

  <div id="toolBody" class="tool-body">
    <div style="text-align:center;padding:40px;color:#475569" th:text="#{tool.loading}">Loading...</div>
  </div>

  <div style="margin-top:20px">
    <div style="font-size:13px;color:#64748b;margin-bottom:8px" th:text="#{tool.more}">More Tools</div>
    <div id="otherTools" class="other-tools"></div>
  </div>
</div>

<div class="footer">
  <p th:text="#{site.footer}">Free tools.</p>
</div>

<script src="/js/tools.js"></script>
<script>
(function(){
  const toolId = '[[${tool}]]';
  const tool = TOOLS.find(t => t.id === toolId);
  if (!tool) return;

  const body = document.getElementById('toolBody');
  body.innerHTML = tool.html();

  // Add output textarea for tools that need it
  if (['json-formatter','html-encoder','css-minifier','hmac-generator'].includes(toolId)) {
    const ta = document.createElement('textarea');
    ta.id = 'out'; ta.readOnly = true;
    ta.style.cssText = 'width:100%;margin-top:12px;min-height:120px;font-family:monospace;font-size:13px;border:1px solid #334155;border-radius:8px;padding:14px;background:#0f172a;color:#e2e8f0;outline:none;resize:vertical';
    body.appendChild(ta);
  }

  const st = document.createElement('div'); st.id = 'status'; body.appendChild(st);
  if (tool.run) tool.run();

  // More tools
  const ot = document.getElementById('otherTools');
  let n = 0;
  TOOLS.forEach(t => { if (t.id !== toolId && n < 12) { ot.innerHTML += `<a href="/tools/${t.id}">${t.name}</a>`; n++; } });
})();
</script>
</body>
</html>
